const form = document.querySelector('form');
const status = document.querySelector('[role="status"]');
const button = form.querySelector('button');
const details = form.elements.details;
const needsReason = form.dataset.form === 'uninstall';
details.addEventListener('input', () => details.setCustomValidity(''));
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!needsReason && !details.value.trim()) {
    details.setCustomValidity('Please tell us what should be better.');

    return;
  }
  if (!FORM_ID || !ENTRY_DETAILS || (needsReason && !ENTRY_REASON)) {

  const body = new URLSearchParams({ [ENTRY_DETAILS]: details.value.trim() });
  if (needsReason) body.set(ENTRY_REASON, form.elements.reason.value);
  button.disabled = true;
  status.textContent = 'Sending…';
  try {
    await fetch(`https://docs.google.com/forms/d/e/${encodeURIComponent(FORM_ID)}/formResponse`, { method: 'POST', mode: 'no-cors', body });

    status.textContent = 'Thanks for your feedback.';
    form.reset();
  } catch {
    status.textContent = 'We couldn’t send your feedback. Please try again.';
  } finally {
    button.disabled = false;
  }
});
